spring:
  application:
    name: broadworks-mcp
  main:
    banner-mode: "off"

  ai:
    mcp:
      server:
        name: broadworks-mcp
        version: 0.1.0
        # HTTP transport is auto-configured by spring-ai-starter-mcp-server-webmvc. The transport is
        # selected by @ConditionalOnProperty on `spring.ai.mcp.server.protocol` (all three values are
        # matchIfMissing=false, EXCEPT the legacy SSE transport which activates when the property is
        # absent). So this line must be set explicitly to expose the /mcp endpoint the client connects
        # to instead of only the legacy SSE transport at /sse.
        #
        # STATELESS (not STREAMABLE) is required because this server runs as multiple load-balanced
        # instances (CDK desiredCount > 1). The STREAMABLE transport keeps per-client session state
        # (keyed by the Mcp-Session-Id it mints on `initialize`) in memory on a SINGLE instance. Native
        # MCP clients speak the JSON-RPC transport without cookies, so the ALB's cookie stickiness does
        # NOT pin them; follow-up calls (`notifications/initialized`, `tools/call`, DELETE) round-robin
        # to a different instance that never saw the session and are rejected with 404. STATELESS
        # (WebMvcStatelessServerTransport) assigns no session id and handles every POST /mcp
        # self-contained, so any instance can serve any request. This server only exposes @Tool
        # endpoints (no server-initiated notifications / resource subscriptions), so the streaming
        # features STATELESS forgoes are unused here.
        protocol: STATELESS
        # stdio is disabled here and enabled only by the `stdio` profile.
        stdio: false

server:
  port: 8080
  # The app runs behind a TLS-terminating Application Load Balancer that forwards plain HTTP to the
  # container while adding X-Forwarded-Proto/Port headers. Honor those headers so request-derived
  # URLs (notably the OAuth2 login callback redirect_uri) are rebuilt with the external https scheme
  # instead of the internal http scheme. See Spring Boot "Use Behind a Proxy Server".
  # Default is correct for local tests and ECS; override with server.forward-headers-strategy if needed.
  forward-headers-strategy: framework

# ---------------------------------------------------------------------------
# BroadWorks MCP configuration.
# Env placeholders remain only for values ECS or a laptop .env actually injects.
# Everything else uses the application default (also the value tests rely on).
# ---------------------------------------------------------------------------
broadworks:
  public:
    # Public DNS hostname (no scheme/path), e.g. mcp.example.com. The base URL is
    # built as https://<hostname>. Leave empty for local dev (defaults to
    # http://localhost:8080).
    hostname: ${PUBLIC_HOSTNAME:}
  application:
    application-id: ${APPLICATION_ID:broadworks-mcp}
  oidc:
    issuer-uri: https://accounts.google.com
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  storage:
    backend: ${STORAGE_BACKEND:DYNAMODB}
    session-table: ${SESSION_TABLE:broadworks-mcp-sessions}
    # Interactive Google-login HTTP sessions live in their own table (own lifecycle, own id space).
    http-session-table: ${HTTP_SESSION_TABLE:broadworks-mcp-http-sessions}
    user-config-table: ${USER_CONFIG_TABLE:broadworks-mcp-user-config}
    kms-key-id: ${KMS_KEY_ID:}
    region: ${AWS_REGION:}
  auth:
    token:
      access-token-ttl: PT1H
      refresh-token-ttl: P30D
      authorization-code-ttl: PT5M
      pending-authorization-ttl: PT15M
      registered-client-ttl: P90D
    redirect:
      allowed-https-prefixes: ${OAUTH_REDIRECT_ALLOWLIST:}
      # Additionally permit the callbacks of the well-known hosted MCP clients (Claude, ChatGPT,
      # Grok, vscode.dev) so they register without extra configuration. Loopback HTTP (RFC 8252
      # native clients such as Claude Desktop / MCP Inspector) is always allowed regardless.
      allow-well-known-clients: true
  cors:
    # Origins allowed to call /mcp, the discovery documents, /oauth/register and /oauth2/** from a
    # browser (comma-separated). Empty -> the well-known hosted MCP client origins. Only these
    # origins are echoed back, which also serves as the MCP spec's Origin (DNS-rebinding) check.
    allowed-origins: []
    enabled: true
  security:
    # SSRF guard for broadworks_add_connection: connection targets resolving to loopback, link-local
    # (including the 169.254.169.254 instance-metadata endpoint), RFC 1918 / unique-local private, any-
    # local or multicast addresses are rejected, as are unresolvable hostnames. Set to true ONLY for
    # local development against a BroadWorks server on a private LAN; it disables that guard entirely.
    allow-private-network-targets: ${ALLOW_PRIVATE_NETWORK_TARGETS:false}
  alpaca:
    # Live BroadWorks connectivity (real OCI login via the Alpaca toolkit). Default true for
    # runtime/production. Set ALPACA_LIVE=false (or broadworks.alpaca.live=false) only for unit/
    # integration tests that must not wire the live login graph. Requires a reachable BroadWorks
    # OCI server and a valid license; a tuned JCS cache.ccf may be supplied on the classpath or
    # via -Dalpaca.cache.config=/path/to/cache.ccf.
    live: ${ALPACA_LIVE:true}
    connection-cache-ttl: PT30M
    # Alpaca toolkit license, supplied inline as a string (no on-disk license file required).
    # Leave empty to let the provisioned runtime supply the license (file / license manager).
    license-key: ${ALPACA_LICENSE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# ---------------------------------------------------------------------------
# Logging. Per-package levels and the console appender live in logback-spring.xml
# (env-overridable via LOG_LEVEL_* — see README "Logging & troubleshooting").
# The correlation pattern below prepends the MCP request-correlation id stamped
# by McpEndpointLoggingFilter, so every log line for one MCP request shares an id
# (rendered as [--------] for non-MCP traffic).
# ---------------------------------------------------------------------------
logging:
  pattern:
    correlation: "[%X{mcpRequestId:-        }] "
