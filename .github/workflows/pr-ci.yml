name: PR CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: mvn -B -Pinstall-alpaca verify
      - name: Docker build
        run: docker build -t broadworks-mcp:pr .
